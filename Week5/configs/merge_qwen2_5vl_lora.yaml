# Day26:把 LoRA adapter 合并回基座,产出可直接加载的完整模型。
# 运行:
#   .\.venv-vlm\Scripts\python.exe -m llamafactory.cli export Week5/configs/merge_qwen2_5vl_lora.yaml
# 合并后的模型可以直接喂给 Week5/code/compare_finetune.py 做微调前后对比。

model_name_or_path: models/Qwen2.5-VL-7B-Instruct
adapter_name_or_path: saves/qwen2.5vl-7b-week5-lora
template: qwen2_vl
trust_remote_code: true

export_dir: models/Qwen2.5-VL-7B-week5-merged
export_size: 4
export_device: cpu        # 合并走 CPU,避免和推理抢显存
export_legacy_format: false
